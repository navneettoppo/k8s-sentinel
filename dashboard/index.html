<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K3s Sentinel - ClickOps Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>
  <script src="https://unpkg.com/htmx.org@1.9.10/dist/ext/ws.js"></script>
  <style>
    .pulse { animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .status-healthy { @apply bg-green-500; }
    .status-warning { @apply bg-yellow-500; }
    .status-critical { @apply bg-red-500; }
  </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen" hx-ext="ws" ws-connect="/ws">
  <!-- Header -->
  <header class="bg-gray-800 border-b border-gray-700 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 bg-blue-500 rounded-lg flex items-center justify-center">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
          </svg>
        </div>
        <h1 class="text-xl font-bold">K3s Sentinel</h1>
      </div>
      <div class="flex items-center gap-4">
        <div id="connection-status" class="flex items-center gap-2 text-sm">
          <span class="w-2 h-2 bg-green-500 rounded-full pulse"></span>
          <span>Connected</span>
        </div>
        <select id="namespace-filter" class="bg-gray-700 border border-gray-600 rounded px-3 py-1 text-sm" hx-get="/api/nodes" hx-target="#nodes-list">
          <option value="all">All Namespaces</option>
        </select>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6">
    <!-- Stats Grid -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
      <div class="bg-gray-800 rounded-lg p-4 border border-gray-700">
        <div class="text-gray-400 text-sm">Nodes</div>
        <div class="text-2xl font-bold" id="stat-nodes">-</div>
        <div class="text-xs text-green-400" id="stat-nodes-healthy">- healthy</div>
      </div>
      <div class="bg-gray-800 rounded-lg p-4 border border-gray-700">
        <div class="text-gray-400 text-sm">Pods</div>
        <div class="text-2xl font-bold" id="stat-pods">-</div>
        <div class="text-xs text-yellow-400" id="stat-pods-pending">- pending</div>
      </div>
      <div class="bg-gray-800 rounded-lg p-4 border border-gray-700">
        <div class="text-gray-400 text-sm">Active Alerts</div>
        <div class="text-2xl font-bold text-red-400" id="stat-alerts">-</div>
      </div>
      <div class="bg-gray-800 rounded-lg p-4 border border-gray-700">
        <div class="text-gray-400 text-sm">Last Scan</div>
        <div class="text-lg font-mono" id="stat-last-scan">-</div>
      </div>
    </div>

    <div class="grid lg:grid-cols-3 gap-6">
      <!-- Nodes Panel -->
      <div class="lg:col-span-2 bg-gray-800 rounded-lg border border-gray-700">
        <div class="p-4 border-b border-gray-700 flex items-center justify-between">
          <h2 class="font-semibold flex items-center gap-2">
            <svg class="w-5 h-5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 00-2 2v4a2 2 0 002 2h14a2 2 0 002-2v-4a2 2 0 00-2-2m-2-4h.01M17 16h.01"/>
            </svg>
            Nodes
          </h2>
          <button class="text-sm text-blue-400 hover:text-blue-300" hx-get="/api/nodes" hx-target="#nodes-list">Refresh</button>
        </div>
        <div id="nodes-list" class="p-4 space-y-2 max-h-96 overflow-y-auto" hx-trigger="load">
          <div class="text-center text-gray-500 py-8">Loading nodes...</div>
        </div>
      </div>

      <!-- Alerts Panel -->
      <div class="bg-gray-800 rounded-lg border border-gray-700">
        <div class="p-4 border-b border-gray-700 flex items-center justify-between">
          <h2 class="font-semibold flex items-center gap-2">
            <svg class="w-5 h-5 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
            </svg>
            Recent Alerts
          </h2>
          <span id="alert-count" class="bg-red-500 text-white text-xs px-2 py-0.5 rounded-full">0</span>
        </div>
        <div id="alerts-list" class="p-4 space-y-2 max-h-96 overflow-y-auto" hx-trigger="load" ws-send>
          <div class="text-center text-gray-500 py-8">Loading alerts...</div>
        </div>
      </div>
    </div>

    <!-- Dependency Graph -->
    <div class="mt-6 bg-gray-800 rounded-lg border border-gray-700">
      <div class="p-4 border-b border-gray-700 flex items-center justify-between">
        <h2 class="font-semibold flex items-center gap-2">
          <svg class="w-5 h-5 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/>
          </svg>
          Resource Topology
        </h2>
        <button class="text-sm text-blue-400 hover:text-blue-300" hx-get="/api/topology" hx-target="#topology-graph">Refresh</button>
      </div>
      <div id="topology-graph" class="p-4 min-h-64" hx-trigger="load">
        <div class="text-center text-gray-500 py-8">Loading topology...</div>
      </div>
    </div>

    <!-- Quick Actions -->
    <div class="mt-6 bg-gray-800 rounded-lg border border-gray-700 p-4">
      <h2 class="font-semibold mb-4 flex items-center gap-2">
        <svg class="w-5 h-5 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
        </svg>
        Quick Actions
      </h2>
      <div class="flex flex-wrap gap-3">
        <button class="px-4 py-2 bg-blue-600 hover:bg-blue-500 rounded text-sm font-medium transition"
                hx-post="/api/actions/scan" hx-target="#action-result">
          Scan Cluster
        </button>
        <button class="px-4 py-2 bg-yellow-600 hover:bg-yellow-500 rounded text-sm font-medium transition"
                hx-post="/api/actions/clear-cache" hx-target="#action-result">
          Clear Cache
        </button>
        <button class="px-4 py-2 bg-purple-600 hover:bg-purple-500 rounded text-sm font-medium transition"
                hx-post="/api/actions/export" hx-target="#action-result">
          Export Report
        </button>
        <button class="px-4 py-2 bg-gray-600 hover:bg-gray-500 rounded text-sm font-medium transition"
                hx-get="/api/health" hx-target="#action-result">
          Health Check
        </button>
      </div>
      <div id="action-result" class="mt-4 text-sm font-mono text-gray-300"></div>
    </div>
  </main>

  <!-- Templates -->
  <template id="node-template">
    <div class="flex items-center justify-between p-3 bg-gray-700 rounded-lg hover:bg-gray-650 transition">
      <div class="flex items-center gap-3">
        <div class="node-status w-3 h-3 rounded-full bg-green-500"></div>
        <div>
          <div class="font-medium node-name">-</div>
          <div class="text-xs text-gray-400 node-roles">-</div>
        </div>
      </div>
      <div class="text-right text-sm">
        <div class="node-cpu">-</div>
        <div class="text-xs text-gray-400 node-mem">-</div>
      </div>
    </div>
  </template>

  <template id="alert-template">
    <div class="p-3 bg-gray-700 rounded-lg border-l-4 alert-severity">
      <div class="flex items-start justify-between">
        <div>
          <div class="font-medium alert-title">-</div>
          <div class="text-xs text-gray-400 mt-1 alert-resource">-</div>
        </div>
        <span class="text-xs px-2 py-0.5 rounded alert-badge">-</span>
      </div>
      <div class="text-xs text-gray-500 mt-2 alert-time">-</div>
    </div>
  </template>

  <script>
    // WebSocket message handler
    document.body.addEventListener('htmx:wsOpen', () => {
      document.getElementById('connection-status').innerHTML = 
        '<span class="w-2 h-2 bg-green-500 rounded-full pulse"></span><span>Connected</span>';
    });
    
    document.body.addEventListener('htmx:wsClose', () => {
      document.getElementById('connection-status').innerHTML = 
        '<span class="w-2 h-2 bg-red-500 rounded-full"></span><span>Disconnected</span>';
    });

    // Auto-refresh every 30 seconds
    setInterval(() => {
      htmx.ajax('GET', '/api/stats', { target: '#stat-nodes' });
      htmx.ajax('GET', '/api/nodes', { target: '#nodes-list' });
      htmx.ajax('GET', '/api/alerts', { target: '#alerts-list' });
    }, 30000);
  </script>
</body>
</html>
